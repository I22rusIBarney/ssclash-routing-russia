rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,private-ips,DIRECT,no-resolve # приватные IP — всегда напрямую, без DNS
  - IP-CIDR,::/0,REJECT-DROP,no-resolve # весь IPv6-трафик, не попавший в fake-ip — блок
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,private-domains,DIRECT # локальные домены — напрямую

  # --- 🤖 НЕЙРОСЕТИ — САМЫЙ ВЕРХ ---
  # Стоят выше рекламы, Microsoft, RU-списков и всего остального,
  # чтобы ни один другой список не перехватил их домены.
  - RULE-SET,ai-extra,🤖 Нейросети # нейросети + капча/аналитика/авторизация/оплата
  - RULE-SET,ai,🤖 Нейросети # category-ai-!cn
  # Для Copilot: вход в аккаунт Microsoft через ту же страну. Без этих строк вход
  # идёт через 🎮 Игры, а там по умолчанию 🔓 Без VPN — Microsoft видит российский IP.
  # (вход в Xbox тогда тоже пойдёт через 🤖 Нейросети)
  # - DOMAIN-SUFFIX,login.microsoftonline.com,🤖 Нейросети
  # - DOMAIN-SUFFIX,login.live.com,🤖 Нейросети
  # - DOMAIN-SUFFIX,msauth.net,🤖 Нейросети

  # --- Блокировки ---
  - RULE-SET,category-ads,REJECT-DROP # реклама
  - RULE-SET,win-spy,REJECT-DROP # телеметрия Windows

  # --- Торренты ---
  - RULE-SET,torrent-domains,DIRECT # торрент-трекеры — напрямую

  # --- Telegram по IP ---
  - RULE-SET,telegram-ips,PROXY,no-resolve # IP Telegram (в SSClash попадают через Auto fake-ip whitelist)

  # --- YouTube и Google ---
  # YouTube раньше Google, т.к. список google включает домены YouTube
  - RULE-SET,youtube,📺 Youtube
  - RULE-SET,google,🤖 Нейросети # весь остальной Google — та же страна, что и нейросети
  - RULE-SET,google-play,🤖 Нейросети # Google Play — туда же, чтобы аккаунт Google видел одну страну

  # --- Microsoft / Xbox → 🎮 Игры (должны стоять выше category-ru / whitelist / games) ---
  # Опционально: тяжёлые загрузки напрямую (раскомментируйте, если не хотите гнать их через VPN)
  # - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,DIRECT
