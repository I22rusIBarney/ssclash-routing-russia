# ============================================================
# ШАБЛОН MIHOMO ДЛЯ РОУТЕРА (OpenWrt + SSClash-Go) — BobrGO
# Основан на шаблоне RoscomVPN для Remnawave.
# Отличия от клиентского шаблона:
#   • нет своего TUN с auto-route — перехват делает SSClash
#     (tproxy-port / clash-tun, SSClash сам синхронизирует их при Start)
#   • DNS: fake-ip-filter-mode: rule + Auto fake-ip whitelist в SSClash
#   • Telegram по IP (geoip:telegram) — для приложений с зашитыми адресами
#   • правила по имени процесса убраны (на роутере процессов нет)
#   • 🤖 Нейросети — ИЗОЛИРОВАННАЯ группа:
#       - только ручной выбор узла (select), без ⚡️ Авто и без DIRECT внутри
#       - все локации, кроме РФ-узлов и служебных цепочек
#       - правила нейросетей стоят В САМОМ ВЕРХУ, до рекламы/Microsoft/RU и т.д.
#       - вспомогательные домены (капча Cloudflare, statsig, intercom, sentry,
#         auth0, оплата Stripe, вход через Apple и т.п.) идут в ту же страну,
#         чтобы сервис видел один IP
#       - весь Google (кроме YouTube) и Google Play — туда же
#       - DNS для этих доменов тоже резолвится через 🤖 Нейросети
#   • ⚡️ Авто не выбирает РФ-узел YouTube и служебные цепочки «Обход белых списков»
#   • Microsoft и Xbox идут в группу 🎮 Игры (выберите там 🛡️ VPN, чтобы завернуть в VPN)
#
# ВАЖНО: в режиме fake-ip SSClash отправляет в mihomo только трафик на адреса
# fake-ip (198.18.x.x) и на IP из fake-ip whitelist. Соединение на НАСТОЯЩИЙ IP
# идёт мимо VPN — с российского адреса. Чтобы нейросети не «моросили», в SSClash-Go
# (Настройки) нужно закрыть обходы:
#   • DNS → Firewall redirect (ловит «зашитый» DNS вроде 8.8.8.8:53)
#   • DNS → Block DoT и Block known DoH (dibdot) — Android «Частный DNS», DoH в браузерах
#   • Options → Drop forwarded IPv6 — IPv6 файрвол SSClash не перехватывает
#   • Options → Kill switch — без интернета, пока mihomo перезапускается (иначе в это
#     окно устройства получают настоящие IP и потом долго ходят напрямую)
# Проверка, когда нейросеть снова ругается: откройте на этом устройстве
#   https://chatgpt.com/cdn-cgi/trace  (или https://claude.ai/cdn-cgi/trace)
#   loc=RU — запрос идёт мимо VPN (DNS/IPv6/обход); другая страна — не тот узел;
#   нужная страна — дело не в маршруте, а в аккаунте/сессии или IP узла.
# ============================================================

mode: rule
tproxy-port: 7894
tun:
  enable: true
  device: clash-tun
  stack: system
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
log-level: info
allow-lan: false
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
find-process-mode: off
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip # fake-ip/redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,private-domains,real-ip # приватные домены — реальные адреса
    - MATCH,fake-ip
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    # DNS нейросетей и Google — через ту же страну, что и их трафик
    "rule-set:ai-extra,ai,google,google-play":
      - https://8.8.8.8/dns-query#🤖 Нейросети
      - https://1.1.1.1/dns-query#🤖 Нейросети
  nameserver:
    - https://8.8.8.8/dns-query#PROXY
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: # исключить из сниффера приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: 🛡️ VPN
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
    type: select
    proxies:
      - ⚡️ Авто
    # LEAVE THIS LINE!
    url: https://www.gstatic.com/generate_204
  - name: 📺 Youtube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    # filter: '🇫🇮 Finland' # Filter connections containing this value (hosts should be named like 🇫🇮 Finland1, 🇫🇮 Finland2, etc.)
    proxies:
      - 🛡️ VPN
      # Если хотите оставить на выбор только определенные узлы, воспользуйтесь filter
  - name: 🎮 Игры
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    # Сюда же попадают Microsoft и Xbox. Чтобы они шли через VPN — выберите
    # здесь 🛡️ VPN (или конкретный узел). По умолчанию первый пункт — 🔓 Без VPN.
    proxies:
      - 🔓 Без VPN
      - 🛡️ VPN
  - name: 🤖 Нейросети
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png
    # Только ручной выбор конкретного узла. Внутри нет ⚡️ Авто, 🛡️ VPN и DIRECT,
    # поэтому страна сама по себе никогда не меняется.
    # Если нейронка ругается на регион — сначала проверьте /cdn-cgi/trace (см. шапку):
    # переключение узла лишь рвёт соединения, а причина обычно в обходе мимо VPN.
    type: select
    exclude-filter: '🇷🇺|YouTube|Обход|🌀' # без РФ-узлов и служебных цепочек
    remnawave:
      include-proxies: false
    include-all: true
  - name: ⚡️ Авто
    type: url-test
    tolerance: 150
    url: https://www.gstatic.com/generate_204
    interval: 300
    exclude-filter: '🇷🇺|YouTube|Обход|🌀' # без РФ-узла YouTube и служебных цепочек
    remnawave:
      include-proxies: false
    include-all: true
    hidden: true
  - name: PROXY
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - 🛡️ VPN
  - name: 🔓 Без VPN
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
  - name: ⛔ Блок
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - REJECT
  - name: ⏭️ Пропуск
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - PASS
rule-providers:
  ai-extra:
    # Домены нейросетей + их вспомогательные сервисы (капча, фичефлаги,
    # аналитика, авторизация, оплата), которых нет в category-ai-!cn.
    # Сервисы сверяют IP этих запросов с IP основной сессии.
    type: inline
    behavior: domain
    payload:
      # OpenAI / ChatGPT
      - '+.openai.com'
      - '+.chatgpt.com'
      - '+.oaistatic.com'
      - '+.oaiusercontent.com'
      - '+.sora.com'
      - '+.livekit.cloud' # голосовой режим ChatGPT
      - 'oaidalleapiprodscus.blob.core.windows.net' # картинки DALL·E (иначе — общий VPN)
      # Anthropic / Claude
      - '+.anthropic.com'
      - '+.claude.ai'
      - '+.claude.com'
      - '+.claudeusercontent.com'
      # Google AI
      - '+.gemini.google.com'
      - '+.aistudio.google.com'
      - '+.generativelanguage.googleapis.com'
      - '+.notebooklm.google'
      - '+.notebooklm.google.com'
      # Прочие
      - '+.perplexity.ai'
      - '+.pplx.ai'
      - '+.grok.com'
      - '+.x.ai'
      - '+.mistral.ai'
      - '+.deepseek.com'
      - '+.cursor.com'
      - '+.cursor.sh'
      - '+.copilot.microsoft.com'
      - '+.copilot.cloud.microsoft'
      - '+.bing.com'
      - '+.suno.com'
      - '+.suno.ai'
      - '+.character.ai'
      # Вспомогательные сервисы
      - '+.challenges.cloudflare.com' # Turnstile-капча
      - '+.cloudflareinsights.com' # маячок Cloudflare на страницах нейросетей
      - 'cloudflare-ech.com' # ECH скрывает настоящий домен: чаще всего это ChatGPT/Claude/Perplexity за Cloudflare
      - '+.arkoselabs.com' # капча OpenAI
      - '+.statsig.com'
      - '+.statsigapi.net'
      - '+.featuregates.org'
      - '+.featureassets.org'
      - '+.prodregistryv2.org'
      - '+.growthbook.io' # фичефлаги
      - '+.intercom.io'
      - '+.intercomcdn.com'
      - '+.intercomassets.com'
      - '+.sentry.io'
      - '+.auth0.com'
      - '+.browser-intake-datadoghq.com'
      - '+.segment.io'
      - '+.segment.com'
      - '+.stripe.com' # оплата подписок ChatGPT/Claude: страна карты сверяется с IP
      - '+.stripe.network'
      - '+.stripecdn.com'
      - 'appleid.apple.com' # «Войти через Apple»
      - 'appleid.cdn-apple.com'
